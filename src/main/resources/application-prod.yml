spring:
  jpa:
    show-sql: false

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}

auth:
  cookie:
    secure: ${AUTH_COOKIE_SECURE:true}
    same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
    domain: ${AUTH_COOKIE_DOMAIN:}

upload:
  profile-dir: ${PROFILE_UPLOAD_DIR:/var/integrix/uploads/profile}
  profile-url-path: ${PROFILE_IMAGE_URL_PATH:/uploads/profile}

jwt:
  secret: ${JWT_SECRET}
